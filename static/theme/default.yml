# The theme Helix ships with. It defines every token, so a user theme only carries
# the values it changes and falls back to the rest.

name: Helix

# The palette the settings theme page lists, section by section. A variable left
# out here is derived from the ones above it and is only edited in the file.
palette:
  Surfaces:
    background:    Background
    fieldSurface:  Field surface
    surfaceHeader: Header surface
    surface:       Panel surface
    surfaceRaised: Raised surface
    selectedFill:  Selected fill
  Lines:
    borderSoft: Soft border
    border:     Panel border
    line:       Line
    lineBright: Line, bright
    gridDot:    Grid dot
  Text:
    textStrong: Strong text
    text:       Body text
    textLabel:  Label text
    textMuted:  Muted text
    textFaint:  Faint text
  Accent:
    accent:       Accent
    accentBright: Accent, bright
  Signals:
    signalBlue:   Node signal, blue
    signalTeal:   Node signal, teal
    signalGreen:  Node signal, green
    signalAmber:  Node signal, amber
    signalRose:   Node signal, rose
    signalViolet: Node signal, violet
  Feedback:
    danger:        Danger
    success:       Success
    warning:       Warning
    warningBright: Warning, bright
  Controls:
    valueFill: Value fill
    handle:    Handle
  Axes:
    axisX:      X axis
    axisXLight: X axis, light
    axisY:      Y axis
    axisYLight: Y axis, light
    axisZ:      Z axis
    axisZLight: Z axis, light
  Viewport:
    geometry: Geometry
  Type:
    fontSans: Interface font
    fontMono: Data font
  Shape:
    panelRadius:   Panel radius
    controlRadius: Control radius

variables:
  # Surfaces, darkest to lightest
  background:    "#0a0a0d"
  fieldSurface:  "#0d0d11"
  surfaceHeader: "#101015"
  surface:       "#141418"
  surfaceRaised: "#191920"

  # The lightest neutral fill, behind a selected row and on a node body
  selectedFill: "#2e2e38"

  # Dimming over the window behind a dialog
  dialogDim: $background @ 0.5

  # Lines, from the faintest divider to the brightest stroke
  borderSoft: "#1d1d25"
  border:     "#262630"
  line:       "#3d3d4c"
  lineBright: "#59596b"

  # The dots across the network canvas
  gridDot: "#262633"

  # Text, brightest to dimmest
  textStrong: "#f6f6f9"
  text:       "#e7e8ec"
  textLabel:  "#9a9aa6"
  textMuted:  "#63636d"
  textFaint:  "#3a3a42"

  # Fonts
  fontSans: "Public Sans"
  fontMono: "Inconsolata"

  # Accent
  accent:       "#8b5cf6"
  accentBright: "#a78bfa"
  accentDim:    $accent @ 0.15
  accentLine:   $accent @ 0.45

  # The signal palette. One hue marks each family of node in the graph, so a
  # wiring diagram reads as a wiring diagram. The hues are kept apart in
  # lightness as well as in hue, so they stay tellable apart on a dark ground.
  signalBlue:   "#4a9eff"
  signalTeal:   "#2fbfa8"
  signalGreen:  "#57c96b"
  signalAmber:  "#d9a441"
  signalRose:   "#e0629b"
  signalViolet: "#9b7cf0"

  # The type scale, in pixels. Every label in the interface picks one of these
  # rather than a size of its own.
  textMicro:   10
  textCaption: 11
  textBody:    12
  textTitle:   13
  textDisplay: 15

  # The spacing scale, on a four pixel grid. Gaps between related things are
  # small, gaps between separate things are large.
  space2:  2
  space4:  4
  space6:  6
  space8:  8
  space12: 12
  space16: 16
  space20: 20
  space24: 24
  space32: 32

  # Fill that marks a value, such as the bar in a slider
  valueFill: "#2e2e38"

  # The grip a value is dragged by
  handle: "#c8c8d2"

  # Destructive actions, such as deleting a point
  danger: "#c98d92"

  # Feedback states
  warning:       "#d97706"
  warningBright: "#f59e0b"
  success:       "#7CCF7D"

  # Axes
  axisX:      "#f5685f"
  axisY:      "#46c98a"
  axisZ:      "#4ea1ff"
  axisXLight: "#f1857d"
  axisYLight: "#7fd3a6"
  axisZLight: "#7fb4f2"

  # Flat shading colour of the display geometry
  geometry: "#a8a8b8"

  # Shape
  panelRadius:   13
  controlRadius: 10

components:
  menu:
    barColor: $surfaceHeader
    # The strip the menus sit in, and the plate behind an open menu.
    barBorderColor: $borderSoft
    itemColor: $text
    itemHoverColor: $textStrong
    itemHoverFill: $borderSoft
    # The application name in the corner of the bar.
    brandColor: $textStrong
  panel:
    # The plate a panel is drawn on, its header strip and its outline.
    surfaceColor:  $surface
    headerColor:   $surfaceHeader
    borderColor:   $borderSoft
    dividerColor:  $borderSoft
    titleColor:    $textStrong
    subtitleColor: $textMuted
    # The shadow a panel lifts itself off the ground with.
    shadowOpacity: 0.5
    shadowOffset:  4
  statusBar:
    surfaceColor: $surfaceHeader
    borderColor:  $borderSoft
    labelColor:   $textMuted
    valueColor:   $text
    # The states a cook can be reported in.
    readyColor:   $success
    busyColor:    $accentBright
    errorColor:   $danger
  splitter:
    # The strip between two panes, and the line that shows it can be dragged.
    handleColor: $background
    hoverColor:  $accentLine
    activeColor: $accent
    # How wide the strip is, in pixels.
    thickness: 6
  network:
    dotColor: $gridDot
    # The box dragged across the canvas to select nodes.
    selectionColor:       $accentDim
    selectionBorderColor: $accentLine
    selectionRadius:      4
  node:
    bodyColor:   $selectedFill
    borderColor: $line
    portColor:   $line
    # Marks the node the viewport draws.
    displayFlagColor: "#4ea1ff"
    # The plate under a node card, brighter than the canvas it sits on.
    cardColor:        $surfaceRaised
    titleColor:       $textStrong
    typeColor:        $textMuted
    # The outline a hovered node takes.
    hoverBorderColor: $lineBright
    # The bar down the leading edge, in the hue of the node's family.
    spineWidth:       3
    # The size of a port mark, in pixels.
    portSize:         7
    # The shadow a card lifts off the canvas with.
    shadowOpacity:    0.5
  nodeLink:
    inactiveColor: $line
    activeColor:   $lineBright
    cutColor:      "#f5685f"
    redirectColor: $lineBright
    # The width a wire is drawn at, in pixels.
    width:       1.6
    activeWidth: 2.2
  parameter:
    # The floating panel container, translucent over the network behind it.
    panelColor:      $surfaceRaised
    # The inset fields inside it, such as sliders and text boxes.
    backgroundColor: $fieldSurface
    lineColor:       $border
    # The label beside a control, and the chip naming the kind of parameter.
    labelColor: $text
    badgeColor: $textMuted
  parameterType:
    # The hue of the chip that names the kind of a parameter, so a row says
    # what it holds before its label is read.
    floatColor:     $signalBlue
    intColor:       $signalTeal
    boolColor:      $signalGreen
    stringColor:    $signalAmber
    dropdownColor:  $signalRose
    vectorColor:    $signalViolet
    rampColor:      $signalViolet
    codeColor:      $signalGreen
    attributeColor: $signalAmber
  spreadsheet:
    backgroundColor:  $fieldSurface
    lineColor:        $border
    selectedRowColor: $selectedFill
    # The strip naming the sheet, and the divider under it.
    headerColor:      $surfaceHeader
    headerBorderColor: $borderSoft
  slider:
    fillColor: $valueFill
  rangeDial:
    # The ring
    trackColor: $fieldSurface
    edgeColor:  $border
    arcColor:   $valueFill
    tickColor:  $textFaint
    # The two handles
    handleColor:      $handle
    handleHoverColor: $textStrong
  codeEditor:
    backgroundColor:   $background
    gutterBorderColor: $borderSoft
    gutterTextColor:   $textFaint
  expression:
    # A component driven by a formula instead of a literal, tinted in the accent
    backgroundColor:      $accent @ 0.06
    borderColor:          $accent @ 0.35
    badgeColor:           $accentBright
    badgeBackgroundColor: $accent @ 0.18
    codeColor:            $textLabel
    resultColor:          $success
    # A formula that failed to evaluate, falls back to the type default
    invalidBackgroundColor: $warning @ 0.06
    invalidBorderColor:     $warning @ 0.35
    invalidResultColor:     $warningBright
  iconButton:
    # Surfaces per button variant, at rest and under the cursor.
    plainHoverColor:  $borderSoft
    fieldColor:       $fieldSurface
    fieldHoverColor:  $surfaceRaised
    accentColor:      $accent
    accentHoverColor: $accentBright
  ramp:
    plotColor:     $fieldSurface
    lineColor:     $border
    curveColor:    $accentBright
    fillColor:     $accent @ 0.25
    pointColor:    $textLabel
    selectedColor: $accentBright
  timeline:
    # The frame scale and its ticks, dimmest to brightest
    baselineColor:  $border
    frameTickColor: $borderSoft
    minorTickColor: $selectedFill
    majorTickColor: $line
    # The play button
    playColor:      $valueFill
    playHoverColor: $textFaint
    # The marker on the current frame
    playheadColor: $accent
  toggle:
    # The track of a switch that is on, and the knob that rides on it.
    onColor: $accent
    knobColor: $textStrong
  popup:
    highlightColor: $accentDim
  tooltip:
    backgroundColor: $surfaceRaised
    borderColor:     $border
    textColor:       $text
  primitivesTree:
    selectedRowColor: $selectedFill
  tabMenu:
    highlightColor:   $accentDim
    focusBorderColor: $accentLine
  nodePath:
    nameColor:      $textMuted
    separatorColor: $textFaint
    # The node the path leads to.
    nodeColor:      $accentBright
  viewport:
    # The radial background gradient, from its bright centre through the base
    # colour out to the dark edge.
    backgroundColor: $background
    gradientCenter:  $background
    gradientEdge:    $background
    geometryColor:   $geometry
    # The panel holding the display toggles, and a toggle that is on.
    hudColor:       $fieldSurface @ 0.72
    hudBorderColor: $border
    toggleOnColor:  $textStrong @ 0.12
