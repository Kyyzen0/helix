# Réponse à @claude dans les issues et les PR (mode interactif).
# Modèle repris de la doc officielle : https://code.claude.com/docs/en/github-actions
# Authentification : secret CLAUDE_CODE_OAUTH_TOKEN (abonnement), généré avec `claude setup-token`.
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  claude:
    # Ne démarre un runner que si le commentaire mentionne @claude
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # permet à Claude de lire les résultats de CI
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Borne le travail par exécution (quota d'abonnement)
          claude_args: "--max-turns 12"
