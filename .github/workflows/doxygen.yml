name: Build & Deploy Doxygen

on:
  push:
    branches: [ main ]

jobs:
  doxygen:
    runs-on: ubuntu-latest
    # The manual is published to a branch of the repository, which the token of
    # the workflow needs the right to write to.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The publishing action pushes a commit, and it needs the whole
          # history to put it on the branch it publishes to.
          fetch-depth: 0
          persist-credentials: true

      - name: Generate Doxygen docs
        uses: mattnotmitt/doxygen-action@v1.12.0

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/html
          publish_branch: gh-pages
