# Relecture automatique des PR : Claude commente les erreurs trouvées dans le diff.
# Modèle repris de la doc officielle (section « Run a skill ») :
# https://code.claude.com/docs/en/github-actions
# Lecture seule sur le code : Claude ne pousse rien, il commente.
# Sur un dépôt public, GitHub ne transmet pas les secrets aux PR de forks : la relecture ne tourne que sur les branches du dépôt.
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools est requis pour que Claude puisse poster des commentaires en ligne
          claude_args: '--max-turns 15 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
