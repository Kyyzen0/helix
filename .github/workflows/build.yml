name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Gates the packaging steps to pushes on main.
env:
  HELIX_PACKAGE: ${{ github.ref == 'refs/heads/main' }}

# Pushing a fix abandons the run it supersedes rather than queueing behind it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The version every package and the release are named after. A release
  # already carrying that tag, draft or not, marks it as cut.
  version:
    runs-on: macos-15
    outputs:
      value: ${{ steps.version.outputs.value }}
      published: ${{ steps.version.outputs.published }}

    steps:
      - uses: actions/checkout@v4

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^project(helix VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          curl -sSf -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          if python3 -c "import json,sys; sys.exit(0 if any(
                r['tag_name'] == 'v$version' for r in json.load(open('releases.json'))) else 1)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          rm -f releases.json

  macos:
    # macos-15 is an Apple silicon (arm64) runner. Helix builds for arm64 only,
    # and the step below fails the job if the runner is anything else.
    runs-on: macos-15

    steps:
      - name: Require Apple silicon
        run: |
          test "$(uname -m)" = "arm64" || { echo "the runner is $(uname -m), not arm64"; exit 1; }

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The pinned versions of cmake and ninja land inside the repository, so the
      # build does not depend on what the runner carries and a sandboxed host can
      # run it without a package manager.
      - name: Bootstrap the toolchain
        run: ./scripts/bootstrap-macos.sh

      # The viewport shaders are compiled into a Metal library at build time. Xcode 26
      # and later ship the Metal compiler as a separate component, which an image may
      # not carry yet, so it is installed when it is missing.
      - name: Metal compiler
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Cache dependency prefix
        uses: actions/cache@v4
        with:
          path: |
            build-super/deps
            build-super/superbuild/Stamp
          key: macos-arm64-deps-v3-${{ hashFiles('cmake/versions.cmake') }}

      - name: Build
        run: |
          source toolchain/env.sh
          cmake -S . -B build-super -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DHELIX_SUPERBUILD=ON
          cmake --build build-super

      # The build compiles the test suite, and this step runs it. A test that
      # does not pass fails the build.
      - name: Run the tests
        run: |
          source toolchain/env.sh
          tests=build-super/helix-build/helix.app/Contents/bin/tests
          if [ ! -x "$tests" ]; then
            echo "the test binary was not found at $tests"
            find build-super -name tests -type f -perm -u+x
            exit 1
          fi

          # A runner does not always carry timeout, so the suite runs without
          # one when neither name is there.
          limit=()
          if command -v timeout > /dev/null; then
            limit=(timeout 900)
          elif command -v gtimeout > /dev/null; then
            limit=(gtimeout 900)
          fi
          ${limit[@]+"${limit[@]}"} "$tests"

      # A test that aborts leaves only "SIGABRT" in the log. macOS writes a crash
      # report with the stack of every thread, so this prints where each one was.
      - name: Show the crash report
        if: failure()
        run: |
          sleep 15
          report=$(ls -t "$HOME"/Library/Logs/DiagnosticReports/tests* 2>/dev/null | head -1)
          if [ -z "$report" ]; then
            echo "no crash report was written"
            ls -la "$HOME/Library/Logs/DiagnosticReports" 2>&1 | head -20
            exit 0
          fi
          echo "report: $report"
          python3 -I - "$report" <<'EOF'
          import json, sys
          text = open(sys.argv[1], errors="replace").read()
          lines = text.split("\n", 1)
          try:
              header = json.loads(lines[0])
              body = json.loads(lines[1])
          except Exception as error:
              print("could not parse the report:", error)
              print(text[:6000])
              sys.exit(0)
          print("exception:", json.dumps(body.get("exception")), "termination:", json.dumps(body.get("termination")))
          images = body.get("usedImages", [])
          def name(index):
              if 0 <= index < len(images):
                  return images[index].get("name", "?")
              return "?"
          for number, thread in enumerate(body.get("threads", [])):
              frames = thread.get("frames", [])
              if not thread.get("triggered") and len(frames) < 3:
                  continue
              limit = 40 if thread.get("triggered") else 14
              print("\nthread %d%s %s" % (number, " (crashed)" if thread.get("triggered") else "", thread.get("name", "")))
              for frame in frames[:limit]:
                  print("  %-28s %s" % (name(frame.get("imageIndex", -1)), frame.get("symbol", "?")))
          EOF

      # Starts the installed bundle, where the libraries, the plugins, the qml modules
      # and the compiled shaders sit apart from the build directory they were built in.
      - name: Smoke test
        timeout-minutes: 15
        run: |
          source toolchain/env.sh
          cmake --install build-super/helix-build --prefix "$PWD/stage"

          exe="$PWD/stage/helix.app/Contents/MacOS/helix"

          # A runner has no console window, so Qt writes its messages to the
          # debugger rather than stderr unless it is told otherwise.
          export QT_FORCE_STDERR_LOGGING=1

          "$exe" > smoke-out.txt 2> smoke-err.txt &
          pid=$!
          sleep 60
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            cat smoke-out.txt smoke-err.txt
            exit 0
          fi
          cat smoke-out.txt smoke-err.txt

          # A hosted runner is a virtual machine and may have no Metal device. The
          # application checks for one before it builds anything and then stops with
          # exactly this message, which is the only early exit the smoke test accepts.
          # It still shows that every library of the bundle was found and loaded, since
          # that happens before the check. Any other exit, such as a missing library or
          # a crash on startup, fails the job.
          if grep -qx "No Metal device available" smoke-err.txt; then
            echo "the runner has no Metal device, so the viewport could not start"
            exit 0
          fi
          echo "helix exited on startup"
          exit 1

      - name: Package
        if: env.HELIX_PACKAGE == 'true'
        run: |
          cd build-super/helix-build
          cpack -G TGZ -B "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        if: env.HELIX_PACKAGE == 'true'
        with:
          name: macos-packages
          if-no-files-found: error
          path: dist

  release:
    needs: [version, macos]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.published != 'true'
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List packages
        run: find artifacts -type f -exec stat -f '%N  %z' {} +

      # Tags the commit with the project version as it publishes the draft
      # release.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.value }}
          draft: true
          files: artifacts/*
