version: 1

name: sweep
namespace: helix
label: Sweep
description: "Drags a profile along a curve to make a surface, like a pipe or a rail."
tags: [curve, surface, polygon]

inputs:
  - label: Backbone
  - label: Profile
    optional: true
outputs: 1

implementation:
  kind: cpp
  library: helixOps
  constructor: sweep

icon: icon.svg

parameters:
  - name: profile_divider
    label: Profile
    type: divider
    icon: disc

  - name: profileShape
    label: Profile Shape
    type: dropdown
    default: round
    options:
      - {value: input, label: Second Input}
      - {value: round, label: Round}
      - {value: square, label: Square}
      - {value: ribbon, label: Ribbon}
    documentation: >-
      The cross-section that is swept along the curve. Round makes a tube, Square a bar and
      Ribbon a flat strip. Second Input uses any shape you connect to the second input.

  - name: profileScale
    label: Profile Scale
    type: float
    default: 1
    range: {min: 0, max: 10}
    documentation: >-
      The thickness of the swept shape. At 1 it keeps the size it was drawn at; 2 makes it twice
      as wide.

  - name: roundColumns
    label: Columns
    type: int
    default: 12
    range: {min: 3, max: 64, minLocked: true}
    hideCondition: profileShape != 1
    documentation: >-
      How many flat sides the round profile has. More columns give a smoother tube but a heavier
      mesh.

  - name: squareColumns
    label: Columns
    type: int
    default: 1
    range: {min: 1, max: 64, minLocked: true}
    hideCondition: profileShape != 2
    documentation: >-
      How many divisions each side of the square profile is cut into. Use more to bend the bar
      smoothly.

  - name: ribbonColumns
    label: Columns
    type: int
    default: 2
    range: {min: 2, max: 64, minLocked: true}
    hideCondition: profileShape != 3
    documentation: >-
      How many divisions the width of the ribbon is cut into. Use more to curve the strip across
      its width.

  - name: caps_divider
    label: Caps
    type: divider
    icon: square-minus

  - name: endCapRow
    label: End Cap
    type: group
    direction: horizontal
    tooltip: Controls for closing the open ends of the swept tube and grouping the caps.
    parameters:
      - name: endCapType
        label: Cap Type
        type: dropdown
        default: none
        labelHidden: true
        tooltip: >
          How to close the open ends of the swept tube. None leaves the ends open,
          Single Polygon fills each end with one face.
        options:
          - {value: none, label: None}
          - {value: single, label: Single Polygon}
        documentation: >-
          Caps close the open ends of the tube. None leaves them open, like a pipe. Single
          Polygon closes each end with one flat face.

      - name: endCapGroup
        label: Cap Group
        type: group
        direction: horizontal
        background: true
        labelHidden: true
        hideCondition: endCapType == 0
        tooltip: >
          Enter the name to put the end cap polygons in this group. You can use this
          group name in later nodes to easily target just the cap polygons.
        parameters:
          - name: endCapGroupEnabled
            label: Cap Group
            type: bool
            labelHidden: true
            tooltip: >
              Create a face group with the end cap polygons in this group. You can use
              this group in later nodes to easily target just the cap polygons.
            style: boolIcon
            styleOptions:
              icon: squares-subtract

          - name: endCapGroupName
            label: Cap Name
            type: string
            default: sweepCap
            labelHidden: true
            background: false
            tooltip: >
              Enter the name to put the end cap polygons in this group. You can use this
              group name in later nodes to easily target just the cap polygons.

  - name: along_sweep_divider
    label: Along Sweep
    type: divider
    icon: route

  - name: stretchTurns
    label: Stretch Around Turns
    type: bool
    default: true
    tooltip: >
      Widen the profile where the curve bends so the tube keeps its thickness around
      turns instead of pinching.
    documentation: >-
      On a sharp bend the inside of a tube would pinch. This widens the profile there so the
      tube keeps an even thickness.

  - name: applyScale
    label: Apply Scale
    type: bool
    default: false

  - name: scaleRamp
    label: Scale Ramp
    type: ramp
    default: 2
    disableCondition: applyScale == 0
    instanceDefaults:
      value: [1, 1]
    documentation: >-
      A curve that sets the thickness along the sweep: its left end is the start of the curve
      and its right end is the finish. Turn on Apply Scale to use it.
