version: 1

name: springs
namespace: enzo
label: Spring Sheet
tags: [simulation, springs, softbody, animation]

outputs: 1

implementation:
  kind: cpp
  library: enzoOps
  constructor: springs

icon: icon.svg

parameters:
  - name: time_divider
    label: Time
    type: divider
    icon: clock

  - name: start_frame
    label: Start Frame
    type: int
    default: 1
    range: {min: 1, max: 100000, minLocked: true}
    tooltip: >
      The frame the simulation starts on. The sheet is always worked out from
      this frame, so scrubbing back and forth gives the same result as playing
      forwards.

  - name: sub_steps
    label: Sub Steps
    type: int
    default: 1
    range: {min: 1, max: 16, minLocked: true}
    tooltip: >
      How many steps each frame is broken into. More steps make a stiff sheet
      hold together better, at the cost of more work.

  - name: shape_divider
    label: Shape
    type: divider
    icon: wind

  - name: columns
    label: Columns
    type: int
    default: 8
    range: {min: 2, max: 64, minLocked: true}
    tooltip: How many points the sheet has along its width.

  - name: rows
    label: Rows
    type: int
    default: 8
    range: {min: 2, max: 64, minLocked: true}
    tooltip: How many points the sheet has down its height.

  - name: spacing
    label: Spacing
    type: float
    default: 1
    range: {min: 0.01, max: 10}
    tooltip: How far apart the points sit when the sheet is at rest.

  - name: origin
    label: Origin
    type: float
    size: 3
    default: 0
    style: xyz
    tooltip: Where the sheet hangs from.

  - name: gravity
    label: Gravity
    type: float
    size: 3
    default: [0, -9.81, 0]
    style: xyz
    tooltip: The pull the sheet feels.

  - name: stiffness
    label: Stiffness
    type: float
    default: 0.5
    range: {min: 0, max: 1}
    tooltip: How hard a spring pulls its two ends back together.

  - name: damping
    label: Damping
    type: float
    default: 0.98
    range: {min: 0, max: 1}
    tooltip: How much of the movement a step keeps.

  - name: iterations
    label: Iterations
    type: int
    default: 4
    range: {min: 1, max: 32, minLocked: true}
    tooltip: How many times the springs are pulled back together in a step.

  - name: seed
    label: Seed
    type: int
    default: 1
    tooltip: >
      The seed the sheet starts from. The same seed always starts the sheet in
      the same shape.
