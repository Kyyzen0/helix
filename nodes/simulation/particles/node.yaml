version: 1

name: particles
namespace: enzo
label: Particles
tags: [simulation, particles, animation]

outputs: 1

implementation:
  kind: cpp
  library: enzoOps
  constructor: particles

icon: icon.svg

parameters:
  - name: time_divider
    label: Time
    type: divider
    icon: clock

  - name: start_frame
    label: Start Frame
    type: int
    default: 1
    range: {min: 1, max: 100000, minLocked: true}
    tooltip: >
      The frame the simulation starts on. The system is always worked out from
      this frame, so scrubbing back and forth gives the same result as playing
      forwards.

  - name: sub_steps
    label: Sub Steps
    type: int
    default: 1
    range: {min: 1, max: 16, minLocked: true}
    tooltip: >
      How many steps each frame is broken into. More steps make a stiff system
      hold together better, at the cost of more work.

  - name: shape_divider
    label: Shape
    type: divider
    icon: sparkles

  - name: count
    label: Count
    type: int
    default: 64
    range: {min: 1, max: 4096, minLocked: true}
    tooltip: How many particles the system holds.

  - name: origin
    label: Origin
    type: float
    size: 3
    default: 0
    style: xyz
    tooltip: Where the particles start.

  - name: extent
    label: Extent
    type: float
    size: 3
    default: 1
    style: xyz
    tooltip: The size of the box the particles start in.

  - name: gravity
    label: Gravity
    type: float
    size: 3
    default: [0, -9.81, 0]
    style: xyz
    tooltip: The pull the particles feel.

  - name: drag
    label: Drag
    type: float
    default: 0.02
    range: {min: 0, max: 1}
    tooltip: The fraction of a particle's speed lost every step.

  - name: swirl
    label: Swirl
    type: float
    default: 0
    range: {min: 0, max: 100}
    tooltip: How hard the vortex around the origin pushes the particles.

  - name: seed
    label: Seed
    type: int
    default: 1
    tooltip: >
      The seed the starting positions come from. The same seed always starts
      the particles in the same places.
