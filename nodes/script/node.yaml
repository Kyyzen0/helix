version: 1

name: script
namespace: helix
label: Script
description: "Runs a short piece of code on every point, to change the shape in your own way."
tags: [script, attribute, expression]

inputs:
  - label: Geometry
outputs: 1

implementation:
  kind: cpp
  library: helixOps
  constructor: script

icon: icon.svg

parameters:
  - name: code
    label: Code
    type: string
    default: ""
    style: code
    tooltip: >
      The code to run once for every point. Point attributes are read and written
      as @name. curPt() returns the index of the point being run and ptCount()
      returns the number of points.
