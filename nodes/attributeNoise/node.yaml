version: 1

name: attributeNoise
namespace: helix
label: Attribute Noise
description: "Roughens the geometry by pushing its points along their normals with noise."
tags: [attribute, noise]

inputs:
  - label: Geometry
outputs: 1

implementation:
  kind: cpp
  library: helixOps
  constructor: attributeNoise

icon: icon.svg

parameters:
  - name: attribute_divider
    label: Attribute
    type: divider
    icon: tag

  - name: name
    label: Attribute Name
    type: string
    default: Position
    style: attribute
    styleOptions:
      owners: point
      attributeTypes: prm(type)
    tooltip: >
      The point attribute the noise writes to. A missing attribute is added with
      the chosen type.

  - name: type
    label: Type
    type: dropdown
    default: vector
    tooltip: >
      The kind of value the attribute stores. A vector gets separate noise on each
      axis.
    options:
      - {value: float, label: Float}
      - {value: vector, label: Vector}
    documentation: >-
      A float stores one number on each point, so the noise only changes how strong something
      is. A vector stores three (x, y, z), so the points can be pushed in any direction.

  - name: alongVectorRow
    label: Noise Along Vector
    type: group
    direction: horizontal
    labelInline: true
    hideCondition: type != 1
    tooltip: Moves the value along a vector attribute scaled by one noise value.
    parameters:
      - name: alongVector
        label: Noise Along Vector
        type: bool
        default: true
        labelHidden: true
        tooltip: Moves the value along a vector attribute scaled by one noise value.

      - name: alongVectorAttribute
        label: Vector Attribute
        type: string
        default: Normal
        labelHidden: true
        hideCondition: alongVector == 0
        style: attribute
        styleOptions:
          owners: point
          attributeTypes: vector
        tooltip: >
          The point vector attribute the noise moves along. When the attribute is
          missing the smooth point normals are used.

  - name: operation
    label: Operation
    type: dropdown
    default: add
    tooltip: How the noise combines with the value already on the attribute.
    options:
      - {value: set, label: Set}
      - {value: add, label: Add}
      - {value: subtract, label: Subtract}
      - {value: multiply, label: Multiply}
      - {value: minimum, label: Minimum}
      - {value: maximum, label: Maximum}
    documentation: >-
      Set replaces what the attribute holds. Add and Subtract push it up or down, Multiply
      scales it, and Minimum and Maximum keep the lower or the higher of the two values.

  - name: noise_divider
    label: Noise
    type: divider
    icon: audio-waveform

  - name: noiseType
    label: Noise Type
    type: dropdown
    default: simplex
    tooltip: The pattern of noise to sample.
    options:
      - {value: simplex, label: Simplex}
      - {value: superSimplex, label: Super Simplex}
      - {value: perlin, label: Perlin}
      - {value: value, label: Value}
      - {value: cellular, label: Cellular}
    documentation: >-
      Each kind of noise has its own grain. Simplex and Perlin give smooth, natural bumps, Value
      is blockier, and Cellular makes a pattern of cells, like cracked mud or scales.

  - name: cellularMode
    label: Cellular Mode
    type: dropdown
    default: value
    hideCondition: noiseType != 4
    tooltip: >
      What each point reads from its nearest cell. Value gives every cell one flat
      value, and distance gives how far the point is from the cell center.
    options:
      - {value: value, label: Value}
      - {value: distance, label: Distance}
    documentation: >-
      Cellular noise cuts space into cells. Value gives each cell one flat value, like tiles.
      Distance gives how far the point is from the center of its cell, which draws soft blobs.

  - name: amplitude
    label: Amplitude
    type: float
    default: 0.2
    tooltip: Scales the noise, which otherwise runs from minus one to one.
    documentation: >-
      The strength of the noise. With 0.2, a point moves by at most 0.2 units. Raise it for
      bigger bumps, lower it for a fine roughness.

  - name: frequency
    label: Frequency
    type: float
    default: 1
    tooltip: How many noise features fit in one unit of space.
    documentation: >-
      The size of the bumps. A higher value gives more, smaller bumps: at 4 there are four times
      as many across the same space, each a quarter of the size.

  - name: offset
    label: Offset
    type: float
    size: 3
    style: xyz
    tooltip: Moves the noise through space.
    documentation: >-
      Slides the noise through space without changing its shape. Animate it to make the bumps
      drift across the surface.

  - name: seed
    label: Seed
    type: int
    default: 0
    tooltip: Picks a different pattern of noise.
    documentation: >-
      A number that picks one pattern among many. The same seed always gives the same noise, so
      change it to get another variation.

  - name: fractal_divider
    label: Fractal
    type: divider
    icon: layers

  - name: fractalType
    label: Fractal Type
    type: dropdown
    default: none
    tooltip: >
      How octaves of the noise are layered. FBm adds finer detail on top of the
      base noise, and Ridged folds each octave into sharp creases.
    options:
      - {value: none, label: None}
      - {value: fbm, label: FBm}
      - {value: ridged, label: Ridged}
    documentation: >-
      Fractal noise stacks several layers of the same noise, each finer than the last (Octaves
      sets how many). FBm stands for fractal Brownian motion: it is the classic look of rock and
      terrain.

  - name: octaves
    label: Octaves
    type: int
    default: 3
    range: {min: 1, max: 10, minLocked: true}
    hideCondition: fractalType == 0
    tooltip: How many layers of noise are stacked.
    documentation: >-
      Each octave is one more layer of noise, finer than the one before. More octaves add finer
      detail but take longer to compute. Between 3 and 6 is usual.

  - name: lacunarity
    label: Lacunarity
    type: float
    default: 2
    hideCondition: fractalType == 0
    tooltip: How much the frequency grows from one octave to the next.
    documentation: >-
      How much finer each layer is than the one before: the frequency is multiplied by this at
      every octave. At 2, each layer has twice as many bumps as the last.

  - name: gain
    label: Gain
    type: float
    default: 0.5
    hideCondition: fractalType == 0
    tooltip: How much each octave contributes compared with the one before it.
    documentation: >-
      How strong each layer is compared with the one before: the amplitude is multiplied by this
      at every octave. At 0.5 each layer is half as strong, so the fine detail stays subtle.
      Higher values make the surface rougher.

  - name: weightedStrength
    label: Weighted Strength
    type: float
    default: 0
    range: {min: 0, max: 1}
    hideCondition: fractalType == 0
    tooltip: >
      Lets octaves contribute less where the layers below them are low, so detail
      gathers on the peaks.
    documentation: >-
      At 0, every layer counts the same. Towards 1, the fine layers count less in the low parts
      of the shape, so the detail gathers on the peaks and the valleys stay smooth.
