version: 1

name: geometryImport
namespace: helix
label: Geometry Import
description: "Loads a 3D model from a file on your Mac."
tags: [import, file, primitive]

# Output 0 is the geometry, with a skin on every point when the file is rigged. Output 1 is the
# skeleton of the file (a mesh whose points are the joints), empty when the file has none.
outputs: 2

# Not in the cook cache: what it produces depends on files on disk, which the cache key does not
# see. The import cache (src/Engine/Import/ImportFile.cpp) checks the file and its dependencies on
# every cook instead, so a keyed import parameter cannot serve a frame of an older version.
cache: false

implementation:
  kind: cpp
  library: helixOps
  constructor: geometryImport

icon: icon.svg

parameters:
  - name: filePath
    label: File Path
    type: string
    style: file
    tooltip: >-
      The file to read. glTF, GLB, FBX, OBJ, STL, PLY, Collada, 3DS, 3MF, DXF, X3D and X are
      read directly, USD, USDA, USDC and USDZ through Model I/O, and BLEND through an installed
      Blender.
    documentation: >-
      The model file this node reads. If you move or rename it, Helix cannot find it any more:
      use Locate to point the scene at its new place. The file itself is never changed.

  - name: size
    label: Scale
    type: float
    default: 1
    documentation: >-
      A scale factor applied to the whole model. 1 keeps the size of the file, 0.01 is a hundred
      times smaller, which fixes a model made in centimeters.

  - name: upAxis
    label: Up Axis
    type: dropdown
    default: auto
    tooltip: The axis the file calls up. Auto reads it from the file, or from the format.
    options:
      - {value: auto, label: Auto}
      - {value: "y", label: Y}
      - {value: "z", label: Z}
    documentation: >-
      Some programs treat Y as up and others Z. Auto reads it from the file. Change it if the
      model comes in lying on its back.

  - name: mergeMeshes
    label: Merge Meshes
    type: bool
    default: true
    tooltip: Joins the meshes of the file into one.
    documentation: >-
      A file often holds many separate objects. Merged, they become one piece of geometry that
      is simpler to work with. Unmerged, each one stays apart.

  - name: blenderPath
    label: Blender
    type: string
    tooltip: >-
      The Blender used to open .blend files. Empty finds the installed one.
    documentation: >-
      Only for .blend files, which Helix opens by running Blender in the background. Leave it
      empty to use the Blender that is installed, or give the path of another one.
